name: Deploy

# Deploys main to the cPanel server after CI passes on main, or by hand (Actions > Deploy > Run workflow).
# Needs the repository secrets DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER and DEPLOY_KEY (a private SSH key whose public half is authorised in
# cPanel > SSH Access). Without them the job does nothing. The server runs scripts/deploy.sh; no secret is printed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then echo "Deploy secrets are not set: nothing to do."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy over SSH
        if: steps.ready.outputs.go == 'yes'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o ServerAliveInterval=30 "$USER_NAME@$HOST" \
            'curl -fsSL https://raw.githubusercontent.com/pitchforgebd/pos-system/main/scripts/deploy.sh -o /tmp/meridian-deploy.sh && bash /tmp/meridian-deploy.sh'
          rm -f ~/.ssh/deploy_key
